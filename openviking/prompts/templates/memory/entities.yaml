memory_type: entities
description: |
  Third-party entity memory: stable cards for real people, organizations, places,
  works, media, products, animals/pets, programs, activities, and concepts the
  user mentions. Store what the entity is and its durable relations.
  Entity identity is the referenced real-world object, not its category or semantic
  similarity. Merge only explicit aliases of the same object. Distinct people, pets,
  works, artworks, products, possessions, places, events, and activities remain separate
  even when they share a theme, owner, participants, appearance, or use.
directory: "viking://user/{{ user_space }}/memories/entities"
filename_template: "{{ category|lower }}/{{ name|lower }}.md"
enabled: true
embedding_template: |-
  {{ category }}

  {{ name }}

  {{ content }}

overview_template: |-
  # Entities Overview
  {% if items %}**Category:** {{ items[0].file_content.category|default(directory_name, true) }}{% endif %}
  {% for item in items %}
  - [{{ item.file_content.name|default(item.file_name, true) }}](./{{ item.file_name }})
  {% endfor %}

fields:
  - name: category
    type: string
    description: |
      Stable directory identifier. Do not follow the session language.

      Before inventing a category, inspect existing category directories in the
      destination self or peer entities scope. Use categories visible in the
      pre-fetched context or through the available listing and search tools.
      If a suitable category already exists, reuse that identifier exactly,
      even when it is non-ASCII or differs from the session language.
      An English conversation reuses an existing Chinese identifier.
      A Chinese conversation reuses an existing English identifier.
      Do not translate it and do not substitute a synonym for the same topic.

      When updating an existing entity, preserve its existing category.
      Do not replace it with a translation, a synonym, or a third variant.
      Existing translated duplicates are not consolidated by choosing a new name.
      Category reuse stays within that destination self or peer scope
      and does not merge distinct entities that share the category.

      If no suitable existing category exists, use one concise English lowercase
      identifier with underscores and at most three words. An existing identifier
      takes precedence over this fallback.
    merge_op: replace

  - name: name
    type: string
    description: |
      - Entity name in Chinese or English. If English, use lowercase with underscores, max 3 words.
    merge_op: replace

  - name: content
    type: string
    description: |
      Compact Markdown card for a third-party entity.

      Required shape: one H1 display name, then one plain sentence on the next line; 
      it must not start with "-", "*", or "1.". 
      Then 2-4 H2 sections, every H2 body must be a bullet list, 1-5 bullets per section; 
      do not write paragraph bodies under H2. Pick natural headings
      such as Description, Purpose, Role, Significance, Values, or Relations.

      Include compact but answerable entity facts. Prefer stable facts, but preserve
      exact user-stated facts that may be asked later: identity, origin, relationship
      or family status, counts, roles, skills, hobbies, favorite works/artists,
      important possessions, and notable dated facts tied to this entity.

      For people, include a Key Facts section when useful. Do not drop exact names,
      counts, dates, places, titles, family relations, or recurring hobbies just to
      generalize. Keep one-off facts only when they are concrete and likely useful
      for future who/what/when/where/how-long questions.

      Keep it readable: 6-14 bullets / about 1200 chars is a soft target. Never drop or
      generalize a distinct answerable fact to meet it. When updating, deduplicate exact or
      paraphrased facts about this same entity and preserve every other existing atomic fact
      unless contradicted.
    merge_op: patch
